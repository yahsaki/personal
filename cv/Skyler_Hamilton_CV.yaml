cv:
  name: Skyler Hamilton
  location: Las Vegas, NV
  email: myresume@yahsaki.com
  phone: +1(000)1112222
  social_networks:
    - network: LinkedIn
      username: skyler-hamilton
    - network: GitHub
      username: yahsaki
  sections:
    experience:
      - company: Reliant Programming Consultancy Services
        position: Software Developer(On the Job Learning)
        start_date: 2012-03
        end_date: 2016-12
        location: Las Vegas, NV
        summary: Hired to learn software development on the job
        highlights:
          - Built payment gatways in SOAP & .net framework 3.5 webforms
          - Maintained a web project that allowed real estate agents to get legal documents online
          - Implemented Hudson CI pipeline for all projects(versioned with Subversion)
          - Implemented integration testing for all applicable projects with Selenium
          - built an abomination full PHP website inside of a Wordpress website
      - company: INVIEWLabs, Inc/UNIFILabs, Inc
        position: Software Developer
        start_date: 2016-12
        end_date: 2023-04
        location: Las Vegas, NV
        summary: Built my most expansive projects at this company
        highlights:
          - (Migrated from Subversion to Mercurial near the beginning of this job)
          - Created the intranet site for a Catepillar branch with Sharepoint 2010. This nightmare job changed my life forever
          - Created an AutoCAD and MicroStation v8i/10 plugin that manages files
          - (Migrated from Mercurial to Git around this time)
          - (Company migrated on prem servers to AWS)
          - Built IOS/Android mobile applications with Xamarin(we ignored windows phones at this time)
          - AWS Certified at RE:Invent 2018
          - Converted a large file processing windows server into a fully cloud setup with AWS Firehose, ElasticSearch, Lambda and S3. Costs went from $40k/m to less than $5k/m
          - Implemented a large data aggregation pipeline with AWS APIG, DynamoDB, S3
          - Worked on way too many React projects 
      - company: Autodesk, Inc
        position: Software Developer(DevOps)
        start_date: 2023-04
        end_date: 2026-04
        location: Las Vegas, NV
        summary: 100% WFH. I did mostly DevOps and maintenance here
        highlights:
          - Performed mostly DevOps here
          - Managed Jenkins pipeline until it was sunsetted late in this term
          - Modified main project for SOC2 verification(successfully)
    skills:
      - label: Trait
        details: Combat coder- excel under pressure
      - label: Languages
        details: C#, Javascript, Python, Bash
      - label: Cloud Compute
        details: AWS(strongest), Azure, GCP(very little)
      - label: AWS Resources
        details: Lambda, EC2, APIGateway, ElasticSearch, S3, CloudFront, etc
      - label: Frameworks/Libraries
        details: React, NextJS, Svelte(little), TanStack, Terraform, MSSQL, PostgresQL, SQLite, MongoDB
      - label: Historical Frameworks/Libraries
        details: Hudson, Lerna, Selenium(still active), Angular(version 1), Xamarin, Wordpress(time to time)
