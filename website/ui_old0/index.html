<!DOCTYPE html>

    <script>
      var _ = {
        mode: null,
        clean: () => {
          const head = document.querySelector('head')
          while(head.firstChild) head.removeChild(head.firstChild)
          const body = document.querySelector('body')
          for (let i = 0; i < body.children.length; i++) {
            if (body.children[i].localName !== 'script') {
              body.children[i].remove()
            }
          }
        },
        init: () => {
          _.clean()
          if (typeof _.current.css === 'function') _.current.css()
          if (typeof _.current.html === 'function') _.current.html()
          if (typeof _.current.script === 'function') _.current.script()
          if (typeof _.current.onLoad === 'function') _.current.onLoad()
        },
        current: {css: null, html: null, script: null},
        load: { home: null },
        tool: {},
      }
    </script>
