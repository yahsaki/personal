<!DOCTYPE html>
<html>

  <body>
    <p>my site</p>
    <div id="root"></div>
    <script>
      const _ = {
        articleIndex: 0,
        articleIntervalId: null,
      }
      const clear = () => {
        const root = document.getElementById('root')
        while(root.firstChild) root.removeChild(root.firstChild)
      }
      const createElement = (type, attribs = [], text = null, parent = null) => {
        const element = document.createElement(type)
        if (text) element.textContent = text
        attribs.forEach(a => { element.setAttribute(a.name, a.val) })
        if (parent) parent.appendChild(element)
        return element
      }
      const renderArticle = (title, content) => {
        // should this code clear content? whatever doing it now for now
        clear()
        const root = document.getElementById('root')
        createElement('p',[],title,root)
        createElement('p',[],content,root)
      }
      const renderArticles = (articles) => {
        _.articles = articles
        _.articleIntervalId = setInterval(() => {
          if (_.articleIndex >= (_.articles.length-1)) {
            _.articleIndex = 0
          }

          const article = _.articles[_.articleIndex]
          renderArticle(article.title, article.content)
          console.log(`article ${article.title} rendered`)
          _.articleIndex += 1
        }, 10000)
      }
