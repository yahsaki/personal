<!DOCTYPE html>
  <head></head>
  <body>
    <script>
      var _ = {
        mode: null,
        clean: () => {
          const head = document.querySelector('head')
          while(head.firstChild) head.removeChild(head.firstChild)
          const body = document.querySelector('body')
          for (let i = 0; i < body.children.length; i++) {
            if (body.children[i].localName !== 'script') {
              body.children[i].remove()
            }
          }
          // readd index.css
          const style = document.createElement('link')
          style.setAttribute('id', 'index')
          style.setAttribute('href', 'index.css')
          style.setAttribute('rel', 'stylesheet')
          //style.setAttribute('media', 'screen') // I dont know what this is
          document.head.append(style)
        },
        init: () => {
          _.clean()
          if (typeof _.current.css === 'function') _.current.css()
          if (typeof _.current.html === 'function') _.current.html()
          if (typeof _.current.script === 'function') _.current.script()
          if (typeof _.current.onLoad === 'function') _.current.onLoad()
        },
        current: {css: null, html: null, script: null},
        load: { home: null },
        tool: {},
      }
    </script>
    <script id="home" src="home.js"></script>
    <script id="tester" src="image_slider.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {

        console.log('document loaded')
        // naming is all messed up, init sounds like it should be first. do something
        _.load.home()
        _.init()
      })
    </script>
  </body>
</html>
