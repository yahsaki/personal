<!DOCTYPE html>
  <head>
    <title>My Site</title>
    <style>
      html {
        background-color: #222529;
        color: #e1e4e8;
      }
      #content {
        border: 1px solid black;
        padding: 10px;
        margin: 10px;
        display: grid;
      }
      #s0 {
        grid-column: 1;
        border: 1px solid yellow;
      }
      #s1 {
        grid-column: 2;
        border: 1px solid green;
      }
      #s2 {
        grid-column: 3;
        border: 1px solid purple;
      }
      #terminal-input-container {
        display: flex;
      }
      #terminal-input-title {
        flex: 1 20px;
      }
      #terminal-input {
        flex: 20;
        background-color: #222529;
        color: white;
      }
      #terminal-output {
        list-style-type: none;
        overflow-y: auto;
        margin: 0;
        padding: 0;
      }
      #terminal-output li {
        padding: 1px;
        margin: 1px;
        background-color: #43474d;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <div id="s0"></div>
      <div id="s1">
        <div id="terminal-input-container">
          <span id="terminal-input-title"></span>
          <input type="text" id="terminal-input" autofocus />
        </div>
        <div id="terminal-output-container">
          <ul id="terminal-output"></ul>
        </div>
      </div>
      <div id="s2"></div>
    </div>
    <script>
      const _ = {
        terminalInputId: 'terminal-input',
        terminalOutputId: 'terminal-output',
        mode: null,
        tool: {
          CMD: {name: 'command line', code: 'CMD'},
          KWR: {name: 'kawaru', code: 'KWR'},
        },
        command: {
          clear: command_clear,
          kawaru: command_kawaru,
          exit: command_exit,
          help: command_help,
        }
      }
      const helpers = {
        prepend: (val) => {
          if (!val) {
            console.error(`attempted to prepend null val to terminal output`)
            return
          }
          const li = document.createElement('li')
          if (typeof val === 'string') {
            li.textContent = val
          }
          else if (val instanceof HTMLElement) {
            li.append(val)
          } else {
            console.error(`cant add unknown thing to terminal`)
          }

          document.getElementById(_.terminalOutputId).prepend(li)
        },
        createElement: (type, attribs = [], text = null, parent = null) => {
          const element = document.createElement(type)
          if (text) element.textContent = text
          attribs.forEach(a => { element.setAttribute(a.name, a.val) })
          if (parent) parent.appendChild(element)
          return element
        },
      }
      // not bothering following phones/linux instances; ill put the input tb at the top, and
      // append input instances below it, html style. forget trying to fight that. will be weird
      // on mobile later tho
      document.addEventListener('DOMContentLoaded', () => {
        console.log('document loaded')
        
        document.getElementById('content').style.height = `${window.innerHeight / 1.1}px`

        document.getElementById(_.terminalInputId).addEventListener('keydown', onInputKeydown)
        // magiriwashi
        updateTerminalTitle(_.tool.CMD.code)

        helpers.prepend(
          helpers.createElement('pre', [], `
TODO:
  - command mode switching
  - add kawaru support
          `)
        )
      })

      function updateTerminalTitle(code) {
        if (!_.tool[code]) throw Error(`tool '${code}' doesnt exist`)
        document.getElementById('terminal-input-title').textContent = _.tool[code].code
      }

      function onInputKeydown(e) {
        if (e.key !== 'Enter') return
        if (!e.target?.value?.length) return
        const input = e.target.value
        
        handleInput(input)

        e.target.value = ""
      }
      
      function handleInput(input) {
        const args = input.split(' ')
        const command = args.splice(0, 1)[0]
        if (!_.command[command]) {
          helpers.prepend(`command '${command}' not found`)
          return
        }
        _.command[command](args)
      }

      function command_clear() {
        document.getElementById(_.terminalOutputId).replaceChildren()
        console.log('terminal cleared')
      }
      function command_kawaru(args) {

      }
      function command_exit(args) {

      }
      function command_help(args) {
        helpers.prepend(
          helpers.createElement('pre', [], `
clear: clear terminal
help: what you literally just entered
kawaru: convert romanji to hiragana/katakana
exit: switch back command(CMD) mode
          `)
        )
      }
    </script>
  </body>
</html>
