<!DOCTYPE html>
  <head>
    <title>V1</title>
    <style>
      html {
        background-color: #222529;
        color: #e1e4e8;
      }
      .wrapper {
        display: grid;
        grid-template-columns: repeat(10, minmax(100px, auto));
        grid-auto-rows: 10px;
      }

      * {
        box-sizing: border-box;
      }

      .wrapper {
        border: 2px solid #f76707;
        border-radius: 5px;
        background-color: #fff4e6;
      }
      .wrapper > div {
        border: 2px solid #ffa94d;
        border-radius: 5px;
        background-color: #ffd8a8;
        padding: 1em;
        color: #d9480f;
        overflow: auto;
      }
      .item0 {
        grid-column: 1 / 4;
        grid-row: 1 / 60;
      }
      .item1 {
        grid-column: 4 / 6;
        grid-row: 1;
      }
      .item2 {
        grid-column: 6;
        grid-row: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="item0">One</div>
      <div class="item1">Two<p>more data</p></div>
      <div class="item2">Three</div>
    </div>
    <script>

    </script>
  </body>
</html>
