<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      html {
        background-color: #222529;
        color: #e1e4e8;
        font-size: 12px;
      }
      body {}
      .container {
        margin: 4px;
        padding: 4px;
      }
      .parent-container {
        border: 1px solid #66FF66;
      }
      .wrap-container {
        display: flex;
        flex-wrap: wrap;
      }
      .single-line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .child-container {
        border: 1px solid yellow;
      }
      .header-wrapper {}
      .header {}
      .content-wrapper {}
    </style>
  </head>
  <body>
    <div class="container parent-container wrap-container">
      <div class="container child-container">
        <div class="header-wrapper">
          <div class="header single-line">Yahbsite</div>
        </div>
        <div class="content-wrapper">
          <div class="description single-line">Module personal website built in raw html and javascript</div>
          <div class="tags single-line">personal, another-tag</div>
          <div class="items-container">
            
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
