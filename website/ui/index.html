<!DOCTYPE html>
<html lang="en">
  <head></head>
  <body>
    <script>
      var _ = {
        currentMode: null,
        currentView: null,
        view: {},
        tool: {},
        // most functions initialized in scripts/base.js
        fn: {
          // TODO: move to base.js or some util file
          delay: ms => new Promise((resolve => setTimeout(() => resolve(), ms))),
          createElement: (type, attribs = [], text = null, parent = null) => {
            const element = document.createElement(type)
            if (text) element.textContent = text
            attribs.forEach(a => { element.setAttribute(a.name, a.val) })
            if (parent) parent.appendChild(element)
            return element
          },
          trigger: (el, eventType) => {
            if (typeof eventType === 'string' && typeof el[eventType] === 'function') {
              el[eventType]()
            } else {
              const event =
                typeof eventType === 'string'
                  ? new Event(eventType, {bubbles: true})
                  : eventType
              el.dispatchEvent(event)
            }
          },
          shuffle: (array) => {
            let currentIndex = array.length, temporaryValue, randomIndex
            while (0 !== currentIndex) {
              randomIndex = Math.floor(Math.random() * currentIndex)
              currentIndex -= 1

              temporaryValue = array[currentIndex]
              array[currentIndex] = array[randomIndex]
              array[randomIndex] = temporaryValue
            }
            return array
          },
        },
      }
    </script>
    <script id="script-base" src="scripts/base.js"></script>
    <script id="script-view-home" src="scripts/views/home.js"></script>
    <script id="script-view-nabnak" src="scripts/views/nabnak.js"></script>
    <script id="script-tool-terminal" src="scripts/tools/terminal.js"></script>
    <script id="script-tool-text_scroller" src="scripts/tools/text_scroller.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.location.protocol === 'file:') {
          const body = document.querySelector('body')
          for (let i = 0; i < body.children.length; i++) {
            if (body.children[i].localName !== 'script') {
              body.children[i].remove()
            }
          }
          const el = document.createElement('span')
          el.setAttribute('style', 'font-size:100px;font-weight:bold;color:red;')
          el.innerText = "USE HTTP SERVER!"
          body.appendChild(el)
          return
        }

        // pondered naming this the same as other views/tools but it doesnt have to be, and its probably better
        // that the base's setup fn is named/setup differently anyway
        _.fn.buildBase()
      })
    </script>
  </body>
</html>
